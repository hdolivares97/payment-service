spring.application.name=payment-service

spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:payment_db}
spring.datasource.username=${MYSQL_USER:payment_user}
spring.datasource.password=${MYSQL_PASSWORD:payment_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:payment_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:payment_pass}